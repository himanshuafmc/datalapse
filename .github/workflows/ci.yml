name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests (against answers recorded from Python)
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parity with the Python engine
        run: |
          pip install numpy pandas "matplotlib>=3.7,<3.11"
          npm run parity
      - name: UI checks and a real export in headless Chromium
        run: |
          npx playwright install --with-deps chromium
          node tests/verify_ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: tests/screenshots
